name: release

# Builds the four supported `ocg` artifacts and publishes them with a
# SHA256SUMS file. Nothing is published for a normal push or a manual run:
# the release job only runs for a `v*` tag.
#
# Reliability rules:
#   - `verify` runs formatting, clippy, the full Rust suite, the installer shell
#     tests and configuration validation before any build;
#   - every artifact is built on a native runner for its OS/arch, with an
#     explicit architecture assertion, a native host test run and a `version`
#     smoke test of the final artifact;
#   - the release job depends on every required job and only publishes `v*`
#     tags, marking `-rc.*` releases as prereleases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: formatting
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test suite
        run: cargo test --locked
      - name: installer tests
        run: sh tests/installer_test.sh
      - name: validate shipped configuration
        run: cargo run --quiet --locked -- validate

  build-linux:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: ocg-linux-x86_64
            runner: ubuntu-24.04
            host_arch: x86_64
          - target: aarch64-unknown-linux-musl
            artifact: ocg-linux-arm64
            runner: ubuntu-24.04-arm
            host_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: assert native runner architecture
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      # The native host tests must pass before the artifact is built. The runner
      # matches the target architecture, so this is a real native run.
      - name: native host tests
        run: cargo test --locked
      - name: build ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: smoke-run the final artifact
        run: |
          cp target/${{ matrix.target }}/release/ocg ${{ matrix.artifact }}
          ./${{ matrix.artifact }} version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build-darwin:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: ocg-darwin-arm64
            runner: macos-15
            host_arch: arm64
          - target: x86_64-apple-darwin
            artifact: ocg-darwin-x86_64
            runner: macos-15-intel
            host_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: assert native runner architecture
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: native host tests
        run: cargo test --locked
      - name: build ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: smoke-run the final artifact
        run: |
          cp target/${{ matrix.target }}/release/ocg ${{ matrix.artifact }}
          ./${{ matrix.artifact }} version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # Publishes only for a `v*` tag. `-rc.*` tags are prereleases.
  release:
    needs: [verify, build-linux, build-darwin]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums of the final artifacts
        run: |
          cd dist
          sha256sum ocg-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ocg-release-bundle
          path: dist/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          name: OpenCode Gear ${{ github.ref_name }}
          files: dist/*
          prerelease: ${{ contains(github.ref, '-rc.') }}
          body: |
            OpenCode Gear ${{ github.ref_name }}

            RC3 hardens runtime networking and makes the Lead throttle a
            runtime invariant. It keeps all v0.2 orchestration, context,
            verification and token-efficiency features.

            Networking and updates

            - Coherent proxy policy: one resolved proxy per command, with
              precedence `--disable-proxy` > `OPENCODE_GEAR_DISABLE_PROXY` >
              standard `HTTP_PROXY` / `HTTPS_PROXY` / `ALL_PROXY` / `NO_PROXY`
              (upper- or lower-case) > macOS system proxy > direct.
            - macOS static System Configuration proxy discovery through
              `/usr/sbin/scutil --proxy` (static HTTP/HTTPS plus a safe
              exception list).
            - `--disable-proxy` and `OPENCODE_GEAR_DISABLE_PROXY=1` force direct
              connections and strip every proxy variable from child processes.
            - GitHub API rate-limit diagnostics: a refused request reports the
              rate-limit resource, limit, remaining and reset instead of a bare
              HTTP status.
            - `GH_TOKEN` (preferred) then `GITHUB_TOKEN` are used for OCG's own
              GitHub API requests, and are attached only to `api.github.com`.
            - The system OpenCode upgrade runs
              `opencode upgrade <resolved-version>`, so upstream does not need a
              second latest-release lookup; a compatible system runtime is kept
              when the lookup or the upgrade fails.

            Runtime contracts

            - Runtime provider/model preflight: a coding launch verifies that
              the selected OpenCode runtime exposes every configured model, and
              a missing active Lead model blocks the launch instead of silently
              falling back to another model.
            - Runtime Lead throttle enforcement: the selected agent, model and
              reasoning variant are enforced on the actual Lead request, so
              sticky model/variant state or a reused session cannot change it.
              Consumer routing is unaffected.

            Lead contracts

            ```
            low   lead-low   openai/gpt-5.6-sol   medium
            mid   lead-mid   openai/gpt-5.6-sol   high
            high  lead-high  openai/gpt-6-astra   high
            ```

            Known limitations

            - PAC configuration is detected and reported, but not evaluated.
            - OCG's own HTTP client does not consume SOCKS proxy URLs; a SOCKS
              environment value is preserved for child OpenCode processes.

            The unpinned installer follows the latest stable release by design.
            Pin this candidate explicitly:

            ```bash
            OPENCODE_GEAR_VERSION=${{ github.ref_name }} sh install.sh
            ```

            This is a release candidate intended for real-world testing.
