[package]
name = "opencode-gear"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
description = "Project-agnostic multi-model orchestration for OpenCode"
license = "MIT"
readme = "README.md"
repository = "https://github.com/18601673727/opencode-gear"
keywords = ["opencode", "ai", "agents", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "ocg"
path = "src/main.rs"

[lib]
name = "opencode_gear"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
directories = "6"
tempfile = "3"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_yaml_ng = "0.10.0"

[profile.release]
lto = true
strip = true
