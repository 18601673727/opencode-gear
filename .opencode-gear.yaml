# OCG UI development profile
#
# Lead:
#   low  -> OpenAI GPT-5.6 Luna / high
#   mid  -> OpenAI GPT-5.6 Sol / medium
#   high -> OpenAI GPT-5.6 Sol / high
#
# Workers:
#   Explore       -> Command Code Muse Spark 1.3 Contributor
#   Explore Deep  -> OpenCode Go Space Bunny Free
#   Build         -> Command Code DeepSeek V4.1 Flash
#   Verify        -> OpenCode Go Muse Spark 1.3 Contributor Free
#   Debug         -> OpenCode Go Space Bunny Free
#   Docs          -> Command Code Muse Spark 1.3 Contributor
#   small_model   -> OpenCode Go Muse Spark 1.3 Contributor Free

models:
  providers:
    openai:
      label: "OpenAI"

    opencode-go:
      label: "OpenCode Go"

    goat:
      label: "Command Code"

  models:
    # -------------------------------------------------------
    # Lead models
    # -------------------------------------------------------

    openai-luna:
      provider: openai
      id: gpt-5.6-luna
      label: "GPT-5.6 Luna"

    openai-sol:
      provider: openai
      id: gpt-5.6-sol
      label: "GPT-5.6 Sol"

    # -------------------------------------------------------
    # Command Code workers
    # -------------------------------------------------------

    goat-muse:
      provider: goat
      id: meta/muse-spark-1.3-contributor
      label: "Muse Spark 1.3 Contributor"

    goat-deepseek:
      provider: goat
      id: deepseek/deepseek-v4.1-flash
      label: "DeepSeek V4.1 Flash"

    # -------------------------------------------------------
    # OpenCode Go workers
    # -------------------------------------------------------

    ocgo-bunny:
      provider: opencode-go
      id: space-bunny-free
      label: "Space Bunny Free"

    ocgo-muse-free:
      provider: opencode-go
      id: muse-spark-1.3-contributor-free
      label: "Muse Spark 1.3 Contributor Free"


# -----------------------------------------------------------
# Lead tiers
# -----------------------------------------------------------

throttle:
  default: low

  levels:
    low:
      model: openai-luna
      variant: high

    mid:
      model: openai-sol
      variant: medium

    high:
      model: openai-sol
      variant: high


# -----------------------------------------------------------
# Worker Router
#
# Worker routing is intentionally independent of throttle.
# -----------------------------------------------------------

routing:
  small_model: ocgo-muse-free

  roles:
    explore:
      model: goat-muse

    explore-deep:
      model: ocgo-bunny

    build:
      model: goat-deepseek

    verify:
      model: ocgo-muse-free

    debug:
      model: ocgo-bunny

    docs:
      model: goat-muse


# -----------------------------------------------------------
# Command Code provider injected into OCG-owned OpenCode
# runtime.
#
# Secret remains outside this file:
# COMMAND_CODE_API_KEY
# -----------------------------------------------------------

opencode:
  provider:
    goat:
      npm: "@ai-sdk/openai-compatible"
      name: "Command Code"

      options:
        baseURL: "https://api.commandcode.ai/provider/v1"
        apiKey: "{env:COMMAND_CODE_API_KEY}"

      models:
        "deepseek/deepseek-v4.1-flash":
          name: "DeepSeek V4.1 Flash"

        "meta/muse-spark-1.3-contributor":
          name: "Muse Spark 1.3 Contributor"
